name: Trivy Secret Test

on:
  workflow_dispatch:
  push:
    branches:
      - test-sec

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          format: json
          output: trivy-secret.json

      - name: Print Report
        run: |
          cat trivy-secret.json
