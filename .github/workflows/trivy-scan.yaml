name: Trivy Security Scan

on:
  pull_request:
  push:
    branches: [ master ]
  schedule:
    - cron: "45 7 * * 4"

permissions:
  contents: read
  pull-requests: write

env:
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  trivy-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
        
      - name: Cache Trivy DB
        uses: actions/cache@v5
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-db-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Scan (Vuln, Secret, Misconfig, License)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.71.0
          scan-type: fs
          trivy-config: trivy.yaml
          format: json
          output: trivy-results.json
    
      - name: Extract Trivy summary
        id: summary
        run: |
            chmod +x scripts/extract-trivy-summary.sh
            ./scripts/extract-trivy-summary.sh trivy-results.json
            
      - name: Comment PR with Trivy
        uses: actions/github-script@v9
        with:
         script: |
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: context.issue.number,
            body: `${{ steps.summary.outputs.comment_body }}`
          });


      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-results.json

      - name: Enforce license policy
        run: |
          ALLOWED_LICENSES="MIT|Apache-2.0|BSD-2-Clause|BSD-3-Clause|ISC"

          DISALLOWED=$(jq -r "
            [
              .Results[].Packages[]?
               | select(.Licenses != null)
              | select((.Licenses | join(\",\")) | test(\"$ALLOWED_LICENSES\") | not)
            ]
            | length
            " trivy-results.json)

          echo "Disallowed count: $DISALLOWED"

          if [ "$DISALLOWED" -gt 0 ]; then
            echo "❌ Found disallowed licenses (not in allowed list)"
            exit 1
          fi


      - name: Fail if vulnerabilities found
        run: |
          # LICENSE_COUNT=$(jq '[.Results[].Licenses[]?] | length' trivy-results.json)
          # if [ "$LICENSE_COUNT" -gt 0 ]; then
          #   echo "License compliance issues found"
          #   exit 1
          # fi

          if [ "${{ steps.summary.outputs.critical }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.high }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.medium }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.low }}" -gt 0 ]; then
            echo "Failing due to vulnerabilities/misconfig/secrets"
            exit 1
          fi
