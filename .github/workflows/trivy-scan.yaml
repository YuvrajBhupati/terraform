name: Trivy Security Scan

on:
  pull_request:
  push:
    branches: [ master ]
  schedule:
    - cron: "45 7 * * 4"

permissions:
  contents: read

env:
  TRIVY_CACHE_DIR: /tmp/trivy-cache

jobs:
  trivy-scan:
    name: Full Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Trivy Scan (Vuln, Secret, Misconfig, License)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.71.0
          scan-type: fs
          trivy-config: trivy.yaml
          format: json
          output: trivy-results.json
    
      - name: Extract Trivy summary
        id: summary
        run: |
            chmod +x scripts/extract-trivy-summary.sh
            ./scripts/extract-trivy-summary.sh trivy-results.json
            
      - name: Comment PR with Trivy
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.summary.outputs.comment_body }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: process.env.COMMENT_BODY
            });

      # - name: Upload Trivy report
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: trivy-report
      #     path: trivy-results.json

      - name: Publish Trivy summary
        if: always()
        run: |
          {
            echo "# Trivy Security Scan Summary"
            echo
            echo "${{ steps.summary.outputs.comment_body }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check license compliance
        run: |
            chmod +x scripts/check-license-policy.sh
            ./scripts/check-license-policy.sh trivy-results.json

      - name: Check for vulnerabilities
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.critical }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.high }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.medium }}" -gt 0 ] || \
             [ "${{ steps.summary.outputs.low }}" -gt 0 ]; then
            echo "Failing due to vulnerabilities/misconfig/secrets"
            exit 1
          fi
