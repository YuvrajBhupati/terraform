name: Trivy Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secret Test File
        run: |
          echo "===== Files ====="
          find . -type f | sort

          echo ""
          echo "===== Secret Files ====="
          find . -name "*.env" -o -name "*secret*" || true

      - name: Run Trivy Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          format: json
          output: trivy-secret.json

      - name: Display Results
        run: |
          echo "===== Secret Count ====="
          jq '[.Results[].Secrets[]?] | length' trivy-secret.json

          echo ""
          echo "===== Secret Findings ====="
          jq '.Results[].Secrets[]?' trivy-secret.json || true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-secret-report
          path: trivy-secret.json
